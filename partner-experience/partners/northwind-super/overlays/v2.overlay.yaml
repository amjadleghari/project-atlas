overlay: 1.0.0
info:
  title: Northwind Super — v2
  version: 1.0.0
actions:
  - target: $.info
    update:
      description: |
        Annuity quotes, policies and income schedules for Northwind Super members.

        Income is paid monthly or quarterly only. Partial withdrawals are not
        offered to Northwind members.
  - target: $
    update:
      servers:
        - url: https://northwind.partners.api.example.com/experience/v2
          description: Production
        - url: https://northwind.sandbox.partners.api.example.com/experience/v2
          description: Sandbox
  - target: $.paths['/policies/{policyId}/withdrawals']
    description: Withdrawals are not part of Northwind's agreement
    remove: true
  - target: $.tags[?(@.name == 'Withdrawals')]
    remove: true
  - target: $.components.schemas.WithdrawalRequest
    remove: true
  - target: $.components.schemas.Withdrawal
    remove: true
  - target: $.components.schemas.QuoteRequest.properties.paymentFrequency.enum
    remove: true
  - target: $.components.schemas.QuoteRequest.properties.paymentFrequency
    update:
      enum: [MONTHLY, QUARTERLY]
  - target: $.paths['/quotes'].post
    update:
      description: |
        Returns an indicative quote valid for 14 days. Northwind requests must
        include the member number as `X-Member-Number`.
      parameters:
        - name: X-Member-Number
          in: header
          required: true
          schema:
            type: string
            pattern: '^NW\d{9}$'
